          - button "5月18日 周一 开心 手账 当天累计 ❤️ 开心 亲爱的日记，今天和他一起去看了日落。他偷偷在我手心画了颗爱心，说要把所有温柔都藏进我的掌纹里。回家的路上，他一直握着我的手，暖暖的，像今天的夕阳一样。 今天阳光特别好，你拉着我去公园散步。你突然蹲下，说鞋带松了，我低头看你笨拙地系了个蝴蝶结。抬头时，你笑着说：“这样我们就能一直在一起啦。”心跳声好吵，我好像又初恋了。 今天送了你一份小惊喜，看你拆开礼物时眼睛亮晶晶的，我的心也跟着跳得好快。你笑着说很喜欢，还紧紧抱了我一下，那一刻觉得整个世界都甜得冒泡啦。 今天终于和你一起上了那艘小船。你伸手扶我时，指尖的温度比阳光还暖。船晃晃悠悠的，我靠在你肩上，听见你低声说“别怕”。水波轻轻拍着船舷，像在替我们说着悄悄话。真想时间停在这一刻啊。 播放日记内容 配图预览 日记语音栏" [ref=e360]:
